name: Joomla Package Maker

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # Trigger on tags like 1.0.1, 2.0.0
  workflow_dispatch: # Enable manual trigger from the Actions tab

env:
  PKG_NAME: contractor
  # Set your package name here (without .xml extension)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to attach the ZIP to the release

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: |
          mkdir build_dir
          cp -r source/* build_dir/
          
          PKG_XML="${{ env.PKG_NAME }}.xml"
          
          if [ -f "build_dir/administrator/$PKG_XML" ]; then
            echo "Manifest found in administrator directory. Moving to root."
            mv "build_dir/administrator/$PKG_XML" "build_dir/"
          elif [ -f "build_dir/$PKG_XML" ]; then
            echo "Manifest already in root directory. Proceeding."
          else
            echo "Error: Manifest file $PKG_XML not found in administrator/ or root directory!"
            exit 1
          fi

      - name: Clean up unwanted files
        run: |
          cd build_dir
          find . -name ".DS_Store" -type f -delete
          find . -name "sftp-config.json" -type f -delete

      - name: Create ZIP archive
        run: |
          cd build_dir
          zip -r ../pkg_${{ env.PKG_NAME }}-${{ github.ref_name }}.zip ./*

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg_${{ env.PKG_NAME }}-${{ github.ref_name }}.zip
          generate_release_notes: false